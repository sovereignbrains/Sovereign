name: Проблема с клиентом
description: Что-то не работает или работает не так в Sovereign
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что пишете. Если не открывается сайт или не подключается сервер, сначала загляните в «Инструменты → Не открывается сайт?» и «Проверить подключение» в клиенте: часто это проблема сервиса провайдера — для неё в клиенте есть «Отчёт для поддержки» на карточке подписки.

        Отчёт ниже клиент собирает сам («Настройки → Приложение → Сообщить о проблеме»): в нём нет ваших адресов, ссылок подписок, ключей и названий серверов.
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что делали и что пошло не так. Скриншот очень помогает.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
  - type: input
    id: version
    attributes:
      label: Версия Sovereign
      placeholder: "0.5.18"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Отчёт клиента
      description: Подставляется сам, если открыть эту страницу из клиента. Перед отправкой его можно просмотреть и поправить.
      render: text
